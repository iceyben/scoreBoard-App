<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="bg-blue-950">
    <div class="scoreboard">
      <div class="">
        <h1 class="h1">Home</h1>
        <h1 id="score" class="h2">0</h1>
        <span class="my-4 space-x-3 sm:space-x-4">
          <a onclick="add1()" href="#" class="points">+1</a>
          <a onclick="add2()" href="#" class="points">+2</a>
          <a onclick="add3()" href="#" class="points">+3</a>
        </span>
      </div>
      <div>
        <h1 class="h1">Away</h1>
        <h1 id="score2" class="h2">0</h1>
        <span class="my-4 space-x-3">
          <a onclick="awayAdd1()" href="#" class="points">+1</a>
          <a onclick="awayAdd2()" href="#" class="points">+2</a>
          <a onclick="awayAdd3()" href="#" class="points">+3</a>
        </span>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
